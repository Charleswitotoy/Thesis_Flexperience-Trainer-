<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Menu HTML and CSS | CodingNepal</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../img/Flexperience logo.png" alt="logo" />
        <h2>Flexperience</h2>
      </div>
      <ul class="sidebar-links">
        <h4>
          <span>Main Menu</span>
          <div class="menu-separator"></div>
        </h4>
        <li>
            <a href="#">
            <span class="material-symbols-outlined">home</span>
            Overview
            </a>
        </li>
        <li>
          <a href="workoutplans.html"><span class="material-symbols-outlined"> fitness_center </span>Workout Plans</a>
        </li>
        <li>
          <a href="#"><span class="material-symbols-outlined">restaurant</span>Meal Plans</a>
        </li>
        <li>
          <a href="#"><span class="material-symbols-outlined">groups</span>Members</a>
        </li>
        <li>
          <a href="#"><span class="material-symbols-outlined">settings</span>Settings</a>
        </li>
    </aside>

    <div class="title_div">
        <h1>
            <span class="page_title">
                Overview
            </span>
        </h1>
    </div>

    <div class="toflex_whole_container">
        <div class="content_container1">
            <div>
                <span id="greeting">
                    Good day,
                </span>
                <br>
                <span id="User_toGreet">
                    Lorem Ipsum
                </span>
                <br>
                You've done a great job today!
            </div>
    
            <div class="member_workout">
                <div class="workout">
                    <span>
                        Workout
                    </span>
                </div>
                <div class="workouts_container">
                    <div class="workouts">
                        <button>
                            <img src="../img/image 17.png" alt="">
                            <br>
                            <br>
                            <div>
                                Yoga
                                <p>
                                    <span class="material-symbols-outlined">timer</span>
                                    30 min
                                    <span class="material-symbols-outlined">local_fire_department</span>
                                    100 kal
                                </p>
                            </div>
                        </button>
                    </div>
                    <div class="workouts">
                        <button>
                            <img src="../img/image 18.png" alt="">
                            <br>
                            <br>
                            <div>
                                Running
                                <p>
                                    <span class="material-symbols-outlined">timer</span>
                                    30 min
                                    <span class="material-symbols-outlined">local_fire_department</span>
                                    100 kal
                                </p>
                            </div>
                        </button>
                    </div>
                    <div class="workouts">
                        <button>
                            <img src="../img/image 19.png" alt="">
                            <br>
                            <br>
                            <div>
                                Push-ups
                                <p>
                                    <span class="material-symbols-outlined">timer</span>
                                    30 min
                                    <span class="material-symbols-outlined">local_fire_department</span>
                                    100 kal
                                </p>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="map_and_progress">
                <div class="div1">
                    <img src="../img/image 1.png" alt="">
                </div>
                <div class="div2">
                    <div class="div2_content_container">
                        <img src="../img/walk.png" alt="">
                        <div>
                            <span> 6 kilometers walked</span>
                            <a href="#">Click for more details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
        <div class="content_container2">
            <div id="calendar">
                Hello
            </div>
        </div>
    </div>
  </body>
</html>
<script src="../script/script.js"></script>
